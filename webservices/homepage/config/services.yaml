# href      → FQDN through Traefik (what you click).
# siteMonitor → DIRECT IP, deliberately. The dot must answer "is the service up?",
#   not "is Traefik up?". Pointing both at the FQDN means a Traefik or DNS fault
#   turns every dot red at once and tells you nothing about which service broke.
#   Uptime Kuma follows the same rule. Do not "tidy" these into FQDNs.
# Netdata has no Traefik router (parked item — LAN-open :19999), so it stays on IP.

